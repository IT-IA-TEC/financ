<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout :: cabeca('Conversa')}"></head>
<body>
<header th:replace="~{layout :: topo('cobranca')}"></header>

<main class="largo">
  <div th:replace="~{layout :: recados}"></div>

  <div class="cabecalho-pagina com-resumo">
    <div>
      <span class="olho"><i></i>WhatsApp na plataforma</span>
      <h1 th:text="${cliente.razaoSocial}">Cliente</h1>
    </div>

    <div class="cartoes-topo">
      <div class="cartao-topo inverso">
        <span class="rotulo">Em aberto</span>
        <b th:text="'R$ ' + ${#numbers.formatDecimal(emAberto, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</b>
        <small th:text="${titulos.size()} + ' documento(s)'">0</small>
      </div>
      <div class="cartao-topo">
        <span class="rotulo">Mensagens</span>
        <b th:text="${mensagens.size()}">0</b>
        <small>nesta conversa</small>
      </div>
      <div class="cartao-topo">
        <span class="rotulo">Canal</span>
        <b th:text="${canalLigado} ? 'ligado' : 'desligado'">ligado</b>
        <small th:text="${canalLigado} ? 'sai daqui' : 'fica na fila'"></small>
      </div>
      <div class="cartao-topo listrado">
        <span class="rotulo">Tom combinado</span>
        <b th:text="${cliente.tomDeCobranca.toLowerCase()}">padrão</b>
        <small>vindo da ficha do cliente</small>
      </div>
    </div>

    <div class="acoes" style="margin:0">
      <a class="botao vazado pequeno" href="/conversas">Voltar</a>
      <a class="botao vazado pequeno"
         th:href="@{'/clientes/unidades/' + ${cliente.id}}">Abrir a ficha</a>
    </div>
  </div>

  <nav th:replace="~{layout :: abas-cobranca('conversas')}" class="modulo"></nav>

  <div class="conversa-caixa">
    <div class="linha-conversa" th:each="m : ${mensagens}"
         th:classappend="${m.deEntrada()} ? 'deles' : 'nossa'">
      <div class="balao">
        <p th:text="${m.corpo}"></p>
        <span class="pe">
          <span th:text="${#temporals.format(m.criadoEm, 'dd/MM HH:mm')}">01/01</span>
          <span th:text="' · ' + ${m.situacaoLegivel}"></span>
          <span th:if="${m.motivo != null}" th:text="' · ' + ${m.motivo}"></span>
        </span>
      </div>
    </div>
    <div class="vazio" th:if="${mensagens.isEmpty()}">
      Nenhuma mensagem nesta conversa ainda.
    </div>
  </div>

  <div class="escrever-conversa">
    <form method="post" th:action="@{'/conversas/' + ${cliente.id} + '/responder'}">
      <label for="cv-texto">Escrever para o cliente</label>
      <textarea id="cv-texto" name="texto" rows="4" required
                placeholder="Oi, tudo bem? Passando para falar do pagamento."></textarea>
      <div class="acoes" style="margin-top:10px">
        <button class="botao" type="submit">Mandar</button>
      </div>
    </form>

    <form method="post" th:action="@{'/conversas/' + ${cliente.id} + '/anotar'}">
      <label for="cv-resposta">Anotar o que o cliente respondeu por fora</label>
      <textarea id="cv-resposta" name="texto" rows="2" required
                placeholder="Ele disse que paga sexta."></textarea>
      <div class="acoes" style="margin-top:10px">
        <button class="botao vazado" type="submit">Registrar a resposta</button>
      </div>
    </form>
  </div>

  <span class="rotulo-bloco" th:if="${!titulos.isEmpty()}">O que este cliente deve</span>
  <div class="tabela-caixa" th:if="${!titulos.isEmpty()}">
    <table>
      <thead>
      <tr>
        <th>Documento</th>
        <th>Descrição</th>
        <th class="centro">Vencimento</th>
        <th class="centro">Saldo</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="t : ${titulos}">
        <td class="mono" th:text="${t.identificadorPix}"></td>
        <td th:text="${t.descricao}"></td>
        <td class="centro mono" th:text="${#temporals.format(t.vencimento, 'dd/MM/yyyy')}"></td>
        <td class="centro mono"
            th:text="'R$ ' + ${#numbers.formatDecimal(t.saldo, 1, 'POINT', 2, 'COMMA')}"></td>
      </tr>
      </tbody>
    </table>
  </div>
</main>

<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
