<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout :: cabeca('Lançar título')}"></head>
<body>
<header th:replace="~{layout :: topo('titulos')}"></header>

<main>
  <div th:replace="~{layout :: recados}"></div>

  <div class="cabecalho-pagina">
    <div>
      <span class="olho"><i></i>novo lançamento</span>
      <h1>Lançar título</h1>
      <p>O número do título e o código do PIX saem sozinhos. Ninguém digita.</p>
    </div>
  </div>

  <div class="vazio" th:if="${clientes.isEmpty()}">
    Esta empresa ainda não tem cliente cadastrado.
    <a href="/clientes">Cadastre o primeiro cliente</a> antes de lançar um título.
  </div>

  <form class="bloco" method="post" action="/titulos" th:if="${!clientes.isEmpty()}">
    <div class="campos">
      <div>
        <label for="clienteId">Cliente</label>
        <select id="clienteId" name="clienteId" required>
          <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.razaoSocial}">Cliente</option>
        </select>
      </div>
      <div>
        <label for="descricao">Descrição</label>
        <input id="descricao" name="descricao" required placeholder="Honorário contábil">
      </div>
      <div>
        <label for="competencia">Competência</label>
        <input id="competencia" name="competencia" type="date" required
               th:value="${#temporals.format(hoje.withDayOfMonth(1), 'yyyy-MM-dd')}">
      </div>
      <div>
        <label for="vencimento">Vencimento</label>
        <input id="vencimento" name="vencimento" type="date" required
               th:value="${#temporals.format(hoje.plusMonths(1).withDayOfMonth(20), 'yyyy-MM-dd')}">
      </div>
      <div>
        <label for="valor">Valor (R$)</label>
        <input id="valor" name="valor" type="number" step="0.01" min="0.01" required placeholder="0,00">
      </div>
    </div>
    <div class="acoes">
      <button class="botao" type="submit">Lançar</button>
      <a class="botao vazado" href="/titulos">Cancelar</a>
    </div>
  </form>
</main>

<script th:replace="~{layout :: scripts}"></script>

</body>
</html>
