<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout :: cabeca('Meu perfil')}"></head>
<body>
<header th:replace="~{layout :: topo('')}"></header>

<main>
  <div th:replace="~{layout :: recados}"></div>

  <div class="cabecalho-pagina">
    <div>
      <span class="olho"><i></i>meu perfil</span>
      <h1 th:text="${usuario.nome}">Pessoa</h1>
      <p th:text="${usuario.email} ?: 'Sem e-mail informado'"></p>
    </div>
  </div>

  <div class="quadros">
    <div class="quadro forte">
      <span class="rotulo">Empresas que você acessa</span>
      <span class="numero" th:text="${empresasDoTopo.size()}">0</span>
      <small>todas separadas entre si</small>
    </div>
    <div class="quadro">
      <span class="rotulo">Empresa aberta agora</span>
      <span class="numero" style="font-size:18px"
            th:text="${usuario.temEmpresaEscolhida} ? ${usuario.exigirEmpresa().nome} : 'nenhuma'"></span>
      <small>trocar pela setinha no topo</small>
    </div>
    <div class="quadro">
      <span class="rotulo">Acesso</span>
      <span class="numero" style="font-size:18px">Sem trava</span>
      <small>senha entra na próxima etapa</small>
    </div>
  </div>

  <div class="secao">
    <h2>Suas empresas</h2>
    <div class="tabela-caixa">
      <table>
        <thead><tr><th>Empresa</th><th>Apelido</th><th>CNPJ</th><th></th></tr></thead>
        <tbody>
        <tr th:each="e : ${empresasDoTopo}">
          <td th:text="${e.nome}"></td>
          <td class="mono" th:text="${e.apelido}"></td>
          <td class="mono" th:text="${e.cnpj} ?: ''"></td>
          <td style="text-align:right">
            <a class="botao pequeno vazado" th:href="@{'/empresas/' + ${e.id} + '/entrar'}">Abrir</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="secao">
    <h2>Sair</h2>
    <p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px">
      Sair fecha a sessão e volta para a tela de entrada.
    </p>
    <a class="botao perigo" href="/sair">Sair do IT.FC</a>
  </div>
</main>

<script th:replace="~{layout :: scripts}"></script>

</body>
</html>
